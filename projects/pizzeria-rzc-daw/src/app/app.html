<header>
  <h1 class="">Pizzería RuzuCa</h1>
  <nav class="flex flex-row gap-2 my-1">
    <a class="custom-a" routerLink="" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
        Inicio
    </a>
    <a class="custom-a" routerLink="carta" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
        Carta
    </a>
    <a class="custom-a" routerLink="contacto" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
        Contacto
    </a>
    <a class="custom-a" routerLink="reservas" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
        Reservas
    </a>

    @if (auth.logged()) {
      <button class="custom-a" (click)="exit()">Salir</button>
    }
    @else {
      <a class="custom-a" routerLink="login" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
          Acceder
      </a>
    }
  </nav>
</header>


<main>
  <router-outlet />
</main>
