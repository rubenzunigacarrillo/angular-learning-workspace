@if ( pizza(); as p ) {

<div class="flex flex-row gap-2 w-full justify-between p-2 font-bold">
  <button (click)="previousPizza()">Anterior</button>
  <button
    class="customButton"
    (click)="bookNow()"
  >Reservar</button>
  <button (click)="nextPizza()">Siguiente</button>
</div>

<section class="flex flex-row justify-between gap-2 p-4 border-2 border-solid bg-white">
  <div class="w-100 flex justify-center">
    <img class="w-64 h-64 object-cover" src="{{ p?.imageURL }}" alt="An image of a {{ p.name }} pizza">
  </div>
  <div class="flex flex-col gap-2 w-full border-l pl-4 border-gray-200">
    <h3 class="font-bold text-2xl">{{ p.name }}</h3>
    <p class="flex flex-col">
      Descripción
      <span class="font-light">
        {{p.description}}
      </span>
    </p>
    <p class="flex flex-col">
      Precio:
      <span class="font-light">
        {{ p.price }}€
      </span>
    </p>
  </div>
</section>
}
@else {
  <h3>Pizza no encontrada ({{ id() }})</h3>
  <app-not-found></app-not-found>
}
