<main class="edit-page">
  <header>
    <span>Gestión de colección</span>
    <h1>Editar libro</h1>
  </header>

  <section class="edit-card">
  @if (selectedBook(); as book) {
    <label for="book-title">
      Nombre:
      <input type="text" [(ngModel)]="title">
    </label>
    <div class="change-options">
      <button class="customButton" (click)="saveChanges()">Guardar</button>
      <a class="customButton" routerLink="/mi-cuenta/biblioteca">Cancelar</a>
    </div>
  }
  @else {
  <p class="missing-book">El libro seleccionado no existe.</p>
  <a class="customButton" routerLink="/mi-cuenta/biblioteca">Volver atrás</a>
}
</section>
</main>
